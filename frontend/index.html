<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Linguao — Traducteur darija · wolof · tahitien</title>
  <meta name="description" content="Traducteur français vers darija, wolof et tahitien, propulsé par Ollama." />
  <meta name="theme-color" content="#0f0e1a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf9fd" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 8h14M5 8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9M9 8v10M9 8 6 5m3 3 3-3M20 22l-4-9-4 9M13.5 19h5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <h1>Linguao</h1>
          <p class="tagline">Français → darija · wolof · tahitien</p>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="lang-picker tap-group" id="lang-picker" role="group" aria-label="Langue cible">
          <button class="lang-pill active" data-lang="darija" type="button" aria-pressed="true">
            <span class="dot" aria-hidden="true"></span>Darija
          </button>
          <button class="lang-pill" data-lang="wolof" type="button" aria-pressed="false">
            <span class="dot" aria-hidden="true"></span>Wolof
          </button>
          <button class="lang-pill" data-lang="tahitien" type="button" aria-pressed="false">
            <span class="dot" aria-hidden="true"></span>Tahitien
          </button>
        </div>

        <div class="register-toggle tap-group" id="register-toggle" role="group" aria-label="Registre">
          <button class="register-option active" data-register="classique" type="button" aria-pressed="true">Classique</button>
          <button class="register-option" data-register="sms" type="button" aria-pressed="false">SMS</button>
        </div>
      </div>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Changer de thème">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v1M12 20v1M4.2 4.2l.7.7M19.1 19.1l.7.7M3 12h1M20 12h1M4.2 19.8l.7-.7M19.1 4.9l.7-.7" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="4.5"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settings-toggle" aria-label="Réglages du serveur">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="settings-panel" id="settings-panel" hidden>
      <label for="api-url-input">Adresse du serveur backend</label>
      <div class="settings-row">
        <input type="text" id="api-url-input" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://192.168.1.10:5000" />
        <button type="button" id="api-url-save">Enregistrer</button>
      </div>
      <p class="settings-hint" id="settings-hint"></p>
    </div>

    <main class="workspace">
      <form class="panels" id="composer">
        <section class="panel">
          <div class="panel-head">
            <span class="panel-label">Français</span>
            <button type="button" class="text-btn" id="clear-btn">Effacer</button>
          </div>
          <textarea
            id="input-text"
            class="panel-textarea"
            placeholder="Écris ta phrase en français..."
            required
          ></textarea>
          <div class="panel-foot">
            <span class="char-count" id="char-count">0 caractère</span>
            <button type="submit" class="translate-btn" id="send-btn">
              <span>Traduire</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M4 12h16M14 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </section>

        <section class="panel result-panel">
          <div class="panel-head">
            <span class="panel-label" id="result-label">
              <span class="result-dot" aria-hidden="true"></span>Darija
            </span>
            <button type="button" class="icon-btn small" id="copy-btn" aria-label="Copier la traduction" disabled>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="12" height="12" rx="2"/>
                <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="panel-result" id="panel-result" aria-live="polite">
            <p class="result-placeholder" id="result-placeholder">La traduction apparaîtra ici.</p>
          </div>
        </section>
      </form>

      <section class="history" id="history" hidden>
        <h2 class="history-title">Traductions récentes</h2>
        <ul class="history-list" id="history-list"></ul>
      </section>
    </main>
  </div>

  <script src="script.js?v=7"></script>
</body>
</html>
