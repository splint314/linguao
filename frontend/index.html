<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Linguao — Traducteur darija · wolof · tahitien</title>
  <meta name="theme-color" content="#0f0e1a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf9fd" media="(prefers-color-scheme: light)" />

  <!-- PWA / app-shell -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Linguao" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="status-bar-spacer" aria-hidden="true"></div>

    <header class="app-header" id="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 8h14M5 8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9M9 8v10M9 8 6 5m3 3 3-3M20 22l-4-9-4 9M13.5 19h5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <h1>Linguao</h1>
          <p class="subtitle">Darija · Wolof · Tahitien</p>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="lang-picker tap-group" id="lang-picker">
        <button class="lang-pill active" data-lang="darija" type="button">
          <span class="dot" aria-hidden="true"></span>Darija
        </button>
        <button class="lang-pill" data-lang="wolof" type="button">
          <span class="dot" aria-hidden="true"></span>Wolof
        </button>
        <button class="lang-pill" data-lang="tahitien" type="button">
          <span class="dot" aria-hidden="true"></span>Tahitien
        </button>
      </div>

      <div class="register-toggle tap-group" id="register-toggle">
        <button class="register-option active" data-register="classique" type="button">Classique</button>
        <button class="register-option" data-register="sms" type="button">SMS</button>
      </div>
    </div>

    <main class="chat" id="chat">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 3a9 9 0 1 0 0 18c1.5 0 2.9-.35 4.15-.98L21 21l-1.02-4.85A9 9 0 0 0 12 3Z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p>Écris une phrase en français ci-dessous pour commencer.</p>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea
        id="input-text"
        placeholder="Écris ta phrase en français..."
        rows="1"
        required
      ></textarea>
      <button type="submit" id="send-btn" class="tap-target" aria-label="Traduire">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 12h16M14 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
