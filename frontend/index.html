<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Linguao — Traducteur darija · wolof · tahitien</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Linguao</h1>
      <p class="subtitle">Darija · Wolof · Tahitien</p>
    </header>

    <div class="controls">
      <div class="lang-picker" id="lang-picker">
        <button class="lang-pill active" data-lang="darija" type="button">Darija</button>
        <button class="lang-pill" data-lang="wolof" type="button">Wolof</button>
        <button class="lang-pill" data-lang="tahitien" type="button">Tahitien</button>
      </div>

      <div class="register-toggle" id="register-toggle">
        <button class="register-option active" data-register="classique" type="button">Classique</button>
        <button class="register-option" data-register="sms" type="button">SMS</button>
      </div>
    </div>

    <main class="chat" id="chat">
      <div class="empty-state" id="empty-state">
        Écris une phrase en français ci-dessous pour commencer.
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea
        id="input-text"
        placeholder="Écris ta phrase en français..."
        rows="1"
        required
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Traduire">→</button>
    </form>
  </div>

  <script src="script.js?v=6"></script>
</body>
</html>
